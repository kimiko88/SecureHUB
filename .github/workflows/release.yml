name: SecureUSB CI/CD — Auto-Version, Build & Release (Go + Rust)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. SUITE DI TEST, RACE DETECTOR, FUZZING BREVE E BENCHMARK (GO + RUST)
  # ==========================================================================
  verify-and-test:
    name: Test, Fuzz & Bench (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (FUSE, OpenGL, X11, exFAT)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libfuse-dev exfatprogs pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Go Unit, Integration, E2E & v0.5 Tests (with Race Detector)
        run: |
          go mod tidy
          go test -v -race ./internal/vault/...

      - name: Run Go Native Fuzzing (10s Smoke Fuzz)
        run: |
          go test -fuzz=FuzzVaultRoundTripAndSeeker -fuzztime=10s ./internal/vault

      - name: Run Go Benchmarks
        run: |
          go test -bench=. -benchmem -run=^$ ./internal/vault

      - name: Run Rust Unit, Integration, E2E, Proptest & v0.5 Suite
        working-directory: secureusb-rs
        run: |
          cargo test --release -- --nocapture

      - name: Verify Rust Criterion Benchmarks Compile & Execute
        working-directory: secureusb-rs
        run: |
          cargo bench --bench vault_bench -- --quick

  # ==========================================================================
  # 2. MATRICE DI COMPILAZIONE CROSS-PLATFORM (LINUX, WINDOWS, MACOS) — GO & RUST
  # ==========================================================================
  build-matrix:
    name: Build (${{ matrix.os_name }} — Go & Rust)
    needs: verify-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux-amd64
            go_bin: secureusb-go-linux-amd64
            rust_bin: secureusb-rs-linux-amd64
            ext: ""
          - os: windows-latest
            os_name: windows-amd64
            go_bin: SecureUSB-Go-Windows-amd64.exe
            rust_bin: SecureUSB-Rust-Windows-amd64.exe
            ext: ".exe"
          - os: macos-latest
            os_name: macos-universal
            go_bin: secureusb-go-macos
            rust_bin: secureusb-rs-macos
            ext: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (FUSE & X11/OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libfuse-dev pkg-config

      - name: Install Windows Dependencies (WinFsp + MinGW System Headers)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/winfsp/winfsp.git /c/winfsp_sdk
          GCC_BIN_DIR="$(dirname "$(which gcc)")"
          MINGW_ROOT="$(cd "$GCC_BIN_DIR/.." && pwd)"
          echo "MinGW root rilevata: $MINGW_ROOT"
          cp -vf /c/winfsp_sdk/inc/fuse/* "$MINGW_ROOT/include/" || true
          if [ -d "$MINGW_ROOT/x86_64-w64-mingw32/include" ]; then
            cp -vf /c/winfsp_sdk/inc/fuse/* "$MINGW_ROOT/x86_64-w64-mingw32/include/" || true
          fi
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CPATH=C:/winfsp_sdk/inc/fuse;C:/winfsp_sdk/inc" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=C:/winfsp_sdk/inc/fuse;C:/winfsp_sdk/inc" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-IC:/winfsp_sdk/inc/fuse -IC:/winfsp_sdk/inc" >> $GITHUB_ENV

      - name: Install macOS Dependencies (FUSE headers only if needed)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail

          FUSE_INCLUDE="$RUNNER_TEMP/fuse-include"
          mkdir -p /tmp/osxfuse_sdk "$FUSE_INCLUDE/fuse"

          if [ ! -d /tmp/osxfuse_sdk/.git ]; then
            git clone --depth 1 https://github.com/osxfuse/fuse.git /tmp/osxfuse_sdk || true
          fi

          if [ -d /tmp/osxfuse_sdk/include ]; then
            find /tmp/osxfuse_sdk/include -maxdepth 1 -type f -name "*.h" -exec cp -vf {} "$FUSE_INCLUDE/" \;
            find /tmp/osxfuse_sdk/include -maxdepth 1 -type f -name "*.h" -exec cp -vf {} "$FUSE_INCLUDE/fuse/" \;
          fi

          sudo mkdir -p /usr/local/include/fuse /usr/local/include/osxfuse/fuse || true
          if [ -d /tmp/osxfuse_sdk/include ]; then
            sudo find /tmp/osxfuse_sdk/include -maxdepth 1 -type f -name "*.h" -exec cp -vf {} /usr/local/include/fuse/ \; || true
            sudo find /tmp/osxfuse_sdk/include -maxdepth 1 -type f -name "*.h" -exec cp -vf {} /usr/local/include/osxfuse/fuse/ \; || true
          fi

          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CPATH=$FUSE_INCLUDE:$FUSE_INCLUDE/fuse" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$FUSE_INCLUDE:$FUSE_INCLUDE/fuse" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$FUSE_INCLUDE -I$FUSE_INCLUDE/fuse -D_FILE_OFFSET_BITS=64" >> "$GITHUB_ENV"

      - name: Build Go Executable (${{ matrix.os_name }})
        shell: bash
        run: |
          mkdir -p dist
          go mod tidy
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -ldflags="-s -w -H=windowsgui" -o "dist/${{ matrix.go_bin }}" .
          else
            go build -ldflags="-s -w" -o "dist/${{ matrix.go_bin }}" .
          fi

      - name: Build Rust Executable with SIMD + LTO (${{ matrix.os_name }})
        shell: bash
        run: |
          cd secureusb-rs
          cargo build --release
          mkdir -p ../dist
          cp "target/release/secureusb-rs${{ matrix.ext }}" "../dist/${{ matrix.rust_bin }}"

      - name: Upload Artifacts (${{ matrix.os_name }})
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_name }}
          path: dist/*

  # ==========================================================================
  # 3. VERSIONAMENTO SEMANTICO AUTOMATICO & RELEASE AD OGNI COMMIT SU MAIN/MASTER
  # ==========================================================================
  publish-release:
    name: Publish GitHub Release (6 Executables)
    needs: build-matrix
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full Tag History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Semantic Version Tag Automatically
        id: semver
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.5.0"
          fi
          echo "Ultimo tag rilevato: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          COMMIT_MSG=$(git log -1 --pretty=%B)

          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          # Evita collisioni se il tag esiste già
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "Nuova versione generata per questo commit: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Download All 6 Built Executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Tag & Publish GitHub Release (6 Executables)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_tag }}
          name: "Release ${{ steps.semver.outputs.new_tag }} (Go & Rust Cross-Platform Binaries)"
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
