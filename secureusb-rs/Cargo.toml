[package]
name = "secureusb-rs"
version = "0.3.0"
edition = "2021"
description = "High-performance encrypted & compressed USB VFS (Argon2id + XChaCha20-Poly1305 In-Place SIMD + Zstd + Rayon)"

[lib]
name = "secureusb_rs"
path = "src/lib.rs"

[[bin]]
name = "secureusb-rs"
path = "src/main.rs"

[features]
default = []
# Abilita il montaggio nativo FUSE / WinFsp (richiede libfuse su Linux/macOS o WinFsp su Windows)
native-fuse = ["dep:fuser"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zstd = { version = "0.13", features = ["zdict_builder"] }
rayon = "1.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"
blake3 = "1.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
lopdf = "0.34"
rfd = "0.15"
open = "5.3"
fuser = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "vault_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
